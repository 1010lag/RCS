name: RCS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rcs_test
          POSTGRES_USER: rcs
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rcs -d rcs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://rcs:ci-only-test-password@localhost:5432/rcs_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
